[package]
  cjc-version = "1.1.3"
  name = "cordis_xisp"
  organization = "ystyle"
  description = "Cordis xisp 插件运行时：用 xisp（Lisp）脚本编写 Cordis 插件"
  version = "0.3.0"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  include = ["src", "LICENSE"]
  # 锚定包根：`examples` 不加 `/` 会连 src 下同名目录一起排除
  exclude = ["/examples"]
  license = ["MIT"]
  repository = "https://atomgit.com/ystyle/cordis-cj.git"
  authors = ["ystyle"]

[package.package-configuration."ystyle::cordis_xisp.cli"]
  output-type = "executable"
  compile-option = "--static"

[dependencies]
  "ystyle::cordis_core" = "0.3.0"
  "ystyle::cordis_plugin" = "0.3.0"
  # xisp 的纯函数子集 registerPure / 求值中断检查点 / 严格解析由 v0.4.1 提供
  "ystyle::xisp" = "0.4.1"
  "jsonvalue" = "1.1.1"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}", "${OHOS_CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}", "${OHOS_CANGJIE_STDX_PATH}"]
