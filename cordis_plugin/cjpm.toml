[package]
  cjc-version = "1.1.3"
  name = "cordis_plugin"
  organization = "ystyle"
  description = "Cordis 动态组合框架插件 SDK"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  include = ["src"]
  license = ["MIT"]
  repository = "https://atomgit.com/ystyle/cordis-cj.git"
  authors = ["ystyle"]

[package.package-configuration."ystyle::cordis_plugin.examples.e2e"]
  output-type = "executable"
  compile-option = "--static"

[package.package-configuration."ystyle::cordis_plugin.examples.macro_demo"]
  output-type = "executable"
  compile-option = "--static"

[package.package-configuration."ystyle::cordis_plugin.examples.event_sub"]
  output-type = "executable"
  compile-option = "--static"

[package.package-configuration."ystyle::cordis_plugin.examples.event_emit"]
  output-type = "executable"
  compile-option = "--static"

[package.package-configuration."ystyle::cordis_plugin.examples.inject_demo"]
  output-type = "executable"
  compile-option = "--static"

[dependencies]
  "ystyle::cordis_core" = "0.1.0"
  "ystyle::jsonrpc" = { path = "../../json-rpc/jsonrpc" }
  "ystyle::jsonrpc_stdio" = { path = "../../json-rpc/jsonrpc_stdio" }
  "ystyle::jsonrpc_unix" = { path = "../../json-rpc/jsonrpc_unix" }
  "jsonvalue" = "1.1.0"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}", "${OHOS_CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}", "${OHOS_CANGJIE_STDX_PATH}"]
